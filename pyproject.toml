[project]
name = "mini-llm-infra"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.14.0",
    "huggingface-hub>=1.28.0",
    "numpy>=2.5.2",
    "torch>=2.13.0",
    "transformers>=4.51.0",
    "triton>=3.7.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
